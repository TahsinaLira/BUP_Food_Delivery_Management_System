{% extends 'rider_base.html' %}
{% block content %}
<h5 class="fw-bold mb-3">Delivery History</h5>
{% for o in orders %}
<div class="card border-0 shadow-sm mb-2"><div class="card-body">
  <div class="d-flex justify-content-between"><span class="fw-bold">{{ o.order_number }}</span><span class="badge bg-success">Delivered</span></div>
  <div class="small text-muted mt-1"><i class="bi bi-shop"></i> {{ o.canteen_name }} → {{ o.location_name }}</div>
  <div class="d-flex justify-content-between small mt-1"><span class="text-muted">{{ o.placed_at }}</span><span class="fw-semibold">{{ money(o.total) }}</span></div>
</div></div>
{% else %}
<div class="text-center text-muted py-4"><i class="bi bi-clock-history fs-1 d-block mb-2"></i>No deliveries yet.</div>
{% endfor %}
{% endblock %}
