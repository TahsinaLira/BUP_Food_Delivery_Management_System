{% extends 'rider_base.html' %}
{% block content %}
<div class="card border-0 shadow-sm text-center mb-3"><div class="card-body">
  <span class="avatar-lg mx-auto">{{ me.full_name[:1] }}</span>
  <h5 class="fw-bold mt-2 mb-0">{{ me.full_name }}</h5>
  <div class="text-muted small">Rider · {{ me.phone }}</div>
  <div class="d-flex justify-content-around mt-3">
    <div><div class="fw-bold fs-5">{{ total }}</div><div class="text-muted small">Delivered</div></div>
    <div><div class="fw-bold fs-5">{{ me.rider_status or 'Available' }}</div><div class="text-muted small">Status</div></div>
  </div>
</div></div>
<a href="{{ url_for('auth.logout') }}" class="btn btn-outline-danger w-100">Log out</a>
{% endblock %}
