{% extends 'rider_base.html' %}
{% block content %}
<div class="text-center">
  <h5 class="fw-bold">Confirm Delivery</h5>
  <p class="text-muted small">Ask the customer for their 4-digit Delivery OTP.</p>
  <div class="card border-0 shadow-sm"><div class="card-body">
    <form method="post" action="{{ url_for('rider.otp', oid=order.id) }}">
      <input name="otp" class="form-control form-control-lg text-center otp-input" maxlength="4" inputmode="numeric"
             pattern="[0-9]{4}" placeholder="____" autofocus required style="letter-spacing:.5rem;font-size:2rem">
      <button class="btn btn-brand btn-lg w-100 mt-3">Confirm Delivery</button>
    </form>
    <a href="{{ url_for('rider.delivery', oid=order.id) }}" class="btn btn-link mt-2">Back</a>
  </div></div>
</div>
{% endblock %}
