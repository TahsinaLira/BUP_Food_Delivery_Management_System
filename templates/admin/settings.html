{% extends 'dashboard_base.html' %}
{% block page_title %}System Settings{% endblock %}
{% block content %}
<div class="card border-0 shadow-sm" style="max-width:640px"><div class="card-body">
  <form method="post">
    <div class="mb-3"><label class="form-label">Standard delivery fee (৳)</label>
      <input class="form-control" value="{{ settings.delivery_fee }}"></div>
    <div class="mb-3"><label class="form-label">Payment methods</label>
      {% for p in settings.payments %}<div class="form-check"><input class="form-check-input" type="checkbox" checked><label class="form-check-label">{{ p }}</label></div>{% endfor %}</div>
    <div class="mb-3"><label class="form-label">Campus delivery availability</label>
      {% for c in settings.campuses %}<div class="form-check"><input class="form-check-input" type="checkbox" checked><label class="form-check-label">{{ c }}</label></div>{% endfor %}</div>
    <div class="form-check form-switch mb-3"><input class="form-check-input" type="checkbox" checked><label class="form-check-label">OTP delivery confirmation</label></div>
    <button class="btn btn-brand">Save Settings</button>
    <p class="text-muted small mt-2 mb-0">Tip: permanent defaults live in <code>config.py</code>.</p>
  </form>
</div></div>
{% endblock %}
