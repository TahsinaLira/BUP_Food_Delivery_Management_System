{% extends 'base.html' %}
{% block title %}Complaint · BUP Food{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-6">
  <h4 class="fw-bold mb-3">Report a Problem</h4>
  <div class="card border-0 shadow-sm"><div class="card-body">
    <form method="post" action="{{ url_for('customer.complaint') }}">
      <div class="mb-3"><label class="form-label">Related order (optional)</label>
        <select name="order_id" class="form-select"><option value="">— None —</option>
          {% for o in orders %}<option value="{{ o.id }}">{{ o.order_number }}</option>{% endfor %}</select></div>
      <div class="mb-3"><label class="form-label">Category</label>
        <select name="category" class="form-select">{% for c in categories %}<option>{{ c }}</option>{% endfor %}</select></div>
      <div class="mb-3"><label class="form-label">Describe the issue</label>
        <textarea name="description" class="form-control" rows="4" required placeholder="What went wrong?"></textarea></div>
      <button class="btn btn-brand w-100">Submit Complaint</button>
    </form>
  </div></div>
</div></div>
{% endblock %}
