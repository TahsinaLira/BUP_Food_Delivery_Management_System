{% extends 'base.html' %}
{% block title %}Edit Profile · BUP Food{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-6">
  <h4 class="fw-bold mb-3">Edit Profile</h4>
  <div class="card border-0 shadow-sm"><div class="card-body">
    <form method="post" action="{{ url_for('customer.edit_profile') }}">
      <div class="mb-3"><label class="form-label">Full Name</label><input name="full_name" class="form-control" value="{{ user.full_name }}" required></div>
      <div class="mb-3"><label class="form-label">Phone</label><input name="phone" class="form-control" value="{{ user.phone or '' }}"></div>
      <div class="row g-3">
        <div class="col-md-6"><label class="form-label">User Type</label>
          <select name="user_type" class="form-select">
            {% for t in ['Student','Faculty','Staff'] %}<option {{ 'selected' if profile.user_type==t else '' }}>{{ t }}</option>{% endfor %}</select></div>
        <div class="col-md-6"><label class="form-label">Campus</label>
          <select name="campus" class="form-select">
            {% for c in ['East Campus','West Campus',"Boys' Hostel","Girls' Hostel"] %}<option {{ 'selected' if profile.campus==c else '' }}>{{ c }}</option>{% endfor %}</select></div>
      </div>
      <div class="mb-3 mt-3"><label class="form-label">Default delivery location</label>
        <select name="default_location_id" class="form-select"><option value="">— None —</option>
          {% for l in locations %}<option value="{{ l.id }}" {{ 'selected' if profile.default_location_id==l.id else '' }}>{{ l.name }}</option>{% endfor %}</select></div>
      <div class="form-check mb-3"><input class="form-check-input" type="checkbox" name="hostel_resident" id="hr" {{ 'checked' if profile.hostel_resident else '' }}>
        <label class="form-check-label" for="hr">Hostel resident</label></div>
      <button class="btn btn-brand w-100">Save Changes</button>
      <a href="{{ url_for('customer.profile') }}" class="btn btn-outline-secondary w-100 mt-2">Cancel</a>
    </form>
  </div></div>
</div></div>
{% endblock %}
