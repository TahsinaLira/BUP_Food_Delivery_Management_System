<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}BUP Food · Rider{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
<div class="rider-frame">
  <div class="rider-top">
    <div class="d-flex align-items-center gap-2">
      <span class="brand-badge"><i class="bi bi-scooter"></i></span>
      <div><div class="fw-bold small">{{ session.get('full_name') }}</div><small class="text-white-50">Delivery Rider</small></div>
    </div>
    {% block rider_top_right %}{% endblock %}
  </div>
  <div class="rider-body">
    {% include 'partials/flash.html' %}
    {% block content %}{% endblock %}
  </div>
  <nav class="rider-bottom">
    {% set ep = request.endpoint %}
    <a href="{{ url_for('rider.dashboard') }}" class="{{ 'active' if ep=='rider.dashboard' else '' }}"><i class="bi bi-house"></i><span>Deliveries</span></a>
    <a href="{{ url_for('rider.history') }}" class="{{ 'active' if ep=='rider.history' else '' }}"><i class="bi bi-clock-history"></i><span>History</span></a>
    <a href="{{ url_for('rider.profile') }}" class="{{ 'active' if ep=='rider.profile' else '' }}"><i class="bi bi-person"></i><span>Profile</span></a>
  </nav>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
