{% extends 'base.html' %}
{% block title %}Register · BUP Food Delivery{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card shadow-sm border-0">
      <div class="card-header bg-white py-3 d-flex align-items-center gap-2">
        <span class="brand-badge"><i class="bi bi-scooter"></i></span>
        <div><h5 class="mb-0 fw-bold">Create your customer account</h5><small class="text-muted">Only BUP community members can register.</small></div>
      </div>
      <div class="card-body p-4">
        <form method="post" action="{{ url_for('auth.register') }}">
          <div class="row g-3">
            <div class="col-md-6"><label class="form-label">Full Name</label><input name="full_name" class="form-control" value="{{ form.get('full_name','') }}" required></div>
            <div class="col-md-6"><label class="form-label">BUP ID</label><input name="bup_id" class="form-control" value="{{ form.get('bup_id','') }}" required></div>
            <div class="col-md-6"><label class="form-label">Email</label><input type="email" name="email" class="form-control" value="{{ form.get('email','') }}" required></div>
            <div class="col-md-6"><label class="form-label">Phone Number</label><input name="phone" class="form-control" value="{{ form.get('phone','') }}"></div>
            <div class="col-md-6"><label class="form-label">Password</label><input type="password" name="password" class="form-control" required></div>
            <div class="col-md-6"><label class="form-label">Confirm Password</label><input type="password" name="confirm" class="form-control" required></div>
            <div class="col-md-4"><label class="form-label">User Type</label>
              <select name="user_type" class="form-select"><option>Student</option><option>Faculty</option><option>Staff</option></select></div>
            <div class="col-md-4"><label class="form-label">Primary Campus</label>
              <select name="campus" class="form-select"><option>East Campus</option><option>West Campus</option><option>Boys' Hostel</option><option>Girls' Hostel</option></select></div>
            <div class="col-md-4 d-flex align-items-end">
              <div class="form-check"><input class="form-check-input" type="checkbox" name="hostel_resident" id="hr"><label class="form-check-label small" for="hr">Hostel resident</label></div>
            </div>
          </div>
          <button class="btn btn-brand w-100 mt-4">Create Account</button>
        </form>
        <p class="text-center small mt-3 mb-0">Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
