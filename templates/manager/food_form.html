{% extends 'dashboard_base.html' %}
{% block page_title %}{{ 'Edit Food' if action=='edit' else 'Add New Food' }}{% endblock %}
{% block content %}
<div class="card border-0 shadow-sm" style="max-width:640px"><div class="card-body">
  <form method="post">
    <div class="mb-3"><label class="form-label">Food name</label>
      <input name="name" class="form-control" value="{{ food.name if food else '' }}" required></div>
    <div class="mb-3"><label class="form-label">Description</label>
      <textarea name="description" class="form-control" rows="2">{{ food.description if food else '' }}</textarea></div>
    <div class="row g-3">
      <div class="col-md-6"><label class="form-label">Category</label>
        <select name="category_id" class="form-select" required>
          {% for c in categories %}<option value="{{ c.id }}" {{ 'selected' if food and food.category_id==c.id else '' }}>{{ c.name }}</option>{% endfor %}
        </select></div>
      <div class="col-md-6"><label class="form-label">Price (৳)</label>
        <input type="number" step="0.01" min="0" name="price" class="form-control" value="{{ food.price if food else '' }}" required></div>
    </div>
    <div class="mb-3 mt-3"><label class="form-label">Image filename (optional)</label>
      <input name="image" class="form-control" value="{{ food.image if food and food.image else '' }}" placeholder="e.g. burger.jpg (place in static/images)"></div>
    <div class="form-check mb-3"><input class="form-check-input" type="checkbox" name="is_available" id="av" {{ 'checked' if (not food) or food.is_available else '' }}>
      <label class="form-check-label" for="av">Available now</label></div>
    <button class="btn btn-brand">{{ 'Save Changes' if action=='edit' else 'Add Food' }}</button>
    <a href="{{ url_for('manager.menu') }}" class="btn btn-outline-secondary">Cancel</a>
  </form>
</div></div>
{% endblock %}
