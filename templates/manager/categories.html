{% extends 'dashboard_base.html' %}
{% block page_title %}Category Management{% endblock %}
{% block content %}
<div class="row g-3" style="max-width:720px">
  <div class="col-md-5">
    <div class="card border-0 shadow-sm"><div class="card-body">
      <h6 class="fw-bold mb-3">Add category</h6>
      <form method="post" action="{{ url_for('manager.categories') }}">
        <input name="name" class="form-control mb-2" placeholder="e.g. Fast Food" required>
        <button class="btn btn-brand w-100">Add Category</button>
      </form>
    </div></div>
  </div>
  <div class="col-md-7">
    <div class="card border-0 shadow-sm"><ul class="list-group list-group-flush">
      {% for c in categories %}
      <li class="list-group-item d-flex justify-content-between align-items-center">
        <span><i class="bi bi-tag text-brand"></i> {{ c.name }} <span class="badge bg-light text-muted">{{ c.item_count }} items</span></span>
        <form method="post" action="{{ url_for('manager.delete_category', catid=c.id) }}" onsubmit="return confirm('Remove this category?')">
          <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button></form>
      </li>
      {% endfor %}
    </ul></div>
  </div>
</div>
{% endblock %}
